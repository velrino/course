name: Course quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: labs/mcp-task-server/package-lock.json
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Install MCP lab dependencies
        run: npm ci --prefix labs/mcp-task-server
      - name: Validate course source
        run: python scripts/validate_course.py
      - name: Check generated navigation and evaluation chart
        run: |
          python scripts/generate_mkdocs_nav.py --check
          python scripts/generate_evaluation_chart.py --check
      - name: Inventory external links without network requests
        run: python scripts/external_link_inventory.py --output external-links.txt
      - name: Build documentation
        run: mkdocs build --strict
      - name: Test executable labs
        run: python labs/run-all-tests.py --require-all
      - uses: actions/upload-artifact@v4
        with:
          name: external-link-inventory
          path: external-links.txt
